# /etc/nginx/sites-available/grade-tracker
# Deploy thật: grades.nghiatech.click
# Chạy `certbot --nginx -d grades.nghiatech.click` sẽ tự thêm block SSL + redirect 80->443.
# File này là bản trước-certbot; certbot ghi thêm listen 443/ssl_certificate và tách server{} redirect riêng.

server {
    listen 80;
    listen [::]:80;
    server_name grades.nghiatech.click;

    root /var/www/grade-tracker;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy về app PM2. App bind mọi interface (Prometheus ở container riêng cần scrape
    # được qua bridge network) nhưng ufw không mở port 5000 ra internet — chỉ chặn ở tầng firewall.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # /metrics KHÔNG được lộ ra internet — Prometheus scrape trực tiếp 127.0.0.1:5000
    location /metrics {
        deny all;
        return 403;
    }
}
