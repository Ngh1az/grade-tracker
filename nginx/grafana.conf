# /etc/nginx/sites-available/grafana
# Grafana ở đây là instance CHUNG cho cả VPS (dùng lại từ lab Monitoring trước),
# không riêng cho Grade Tracker. File này chỉ thêm đường HTTPS cho nó qua subdomain,
# không đụng tới cấu hình/dữ liệu Grafana đang chạy.

server {
    listen 80;
    listen [::]:80;
    server_name grafana.nghiatech.click;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana live tail dùng websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
