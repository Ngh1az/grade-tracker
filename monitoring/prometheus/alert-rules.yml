groups:
  - name: canh-bao-he-thong
    rules:
      # 1) Grade Tracker API chết - nghiêm trọng nhất, báo sau 1 phút
      - alert: GradeTrackerAPIDown
        expr: up{job="grade-tracker-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Grade Tracker API không phản hồi"
          description: "Endpoint /metrics của grade-tracker-api chết hơn 1 phút. Vào VPS chạy: pm2 status và pm2 logs grade-tracker-api --lines 50."

      # 2) Mất số liệu máy chủ (node-exporter chết / VPS sập)
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Mất tín hiệu giám sát máy chủ"
          description: "node-exporter không phản hồi hơn 1 phút - kiểm tra: podman ps."

      # 3) CPU trung bình > 80% liên tục 5 phút
      - alert: HighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU đang ở mức {{ $value | printf \"%.0f\" }}%"
          description: "CPU vượt 80% liên tục 5 phút. Vào VPS chạy: top -o %CPU xem process nào ngốn."

      # 4) RAM dùng > 85% liên tục 5 phút
      - alert: HighRAM
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAM đang ở mức {{ $value | printf \"%.0f\" }}%"
          description: "RAM vượt 85% liên tục 5 phút - nguy cơ app bị kill vì hết bộ nhớ (OOM)."

      # 5) Ổ đĩa gốc còn dưới 15%
      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ổ đĩa đã dùng {{ $value | printf \"%.0f\" }}%"
          description: "Disk sắp đầy - dọn log cũ hoặc nâng cấp. Kiểm tra: df -h và du -sh /*."
