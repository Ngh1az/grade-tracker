global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - alert-rules.yml

scrape_configs:
  # Metrics máy chủ: CPU, RAM, disk
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Metrics ứng dụng: request count + latency (app chạy trên host qua PM2, không trong container)
  - job_name: 'grade-tracker-api'
    static_configs:
      - targets: ['host.docker.internal:5000']
