global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Metrics máy chủ: CPU, RAM, disk
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Metrics ứng dụng: request count + latency (app chạy trên host, không trong docker)
  - job_name: grade-tracker-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
