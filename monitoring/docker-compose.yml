# Stack chuẩn để dựng Prometheus/Alertmanager/Grafana/node-exporter từ đầu trên VPS mới.
# Trên VPS thật đang chạy Grade Tracker, VPS đã có sẵn stack này từ 1 lab trước (share
# chung cho cả VPS) — nên không chạy lại compose này, mà chỉ thêm scrape job +
# alert rule cho grade-tracker-api vào prometheus.yml/alert-rules.yml của stack có sẵn,
# và thêm Nginx vhost (nginx/grafana.conf) để expose Grafana đó qua HTTPS.
# File này vẫn giữ để tái lập toàn bộ hệ thống trên 1 VPS trống.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    # Chỉ nghe localhost — không lộ ra internet
    ports:
      - '127.0.0.1:9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    # Alertmanager 0.27 hỗ trợ discord_configs có sẵn, không cần container bridge riêng.
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - '127.0.0.1:9093:9093'

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)'
    ports:
      - '127.0.0.1:9100:9100'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    # Nginx proxy vào đây; cổng ngoài host tuỳ chọn, không mở ra internet.
    # Trên VPS thật đang map 3001:3000 (3000 đã bị lab khác dùng) — xem nginx/grafana.conf.
    ports:
      - '127.0.0.1:3001:3000'

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
